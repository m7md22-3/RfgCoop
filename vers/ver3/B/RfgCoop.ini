; RfgCoop settings. Put this file next to rfg.exe, beside xinput1_3.dll.
[coop]
; Tag shown in the window title and at the start of every RfgCoop.log line (use A in one game folder, B in the other).
tag=B
; 1 = two-instance dev mode: alt-tab no longer pauses the game, the gamepad drives only the focused window, and the
; log shows frame counters every 5 s. Also F6 (in gameplay) toggles the ghost: a second Mason that replays you 0.4 s
; late through the co-op code path (experiment E2).
dev=1
; Ghost: metres it walks beside you along the world X axis (0 = exactly in your footsteps; it then bumps into you
; whenever you stop).
ghost_offset=2
; Ghost: 1 = melee and trigger counters advance in single player too (lane L5). 0 = fallback: counters copied back
; after each update (your hammer swings are then not replayed).
l5=1
; Ghost: 0 = E2 control run without the PP-STATS patch: the game must crash on the ghost's first frame (AV at
; rfg+5862E6 reading 0x610). Leave at 1.
pp_stats=1
; 1 = this game saves to kee2_savegame_0_0.sav instead of keen_savegame_0_0.sav. Only for the second game (B).
save_tag=1
; Frame cap, e.g. 60 (0 = the game's own). Keeps two games on one PC light.
fps_cap=60
; Window position and size, x,y,w,h, e.g. 0,0,1280,800 (empty = leave it).
window=1280,0,1280,800
