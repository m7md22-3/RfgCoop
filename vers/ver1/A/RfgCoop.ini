; RfgCoop settings. Put this file next to rfg.exe, beside xinput1_3.dll.
[coop]
; Tag shown in the window title and at the start of every RfgCoop.log line (use A in one game folder, B in the other).
tag=A
; 1 = two-instance dev mode: alt-tab no longer pauses the game, the gamepad drives only the focused window, and the
; log shows frame counters every 5 s.
dev=1
; 1 = this game saves to kee2_savegame_0_0.sav instead of keen_savegame_0_0.sav. Only for the second game (B).
save_tag=0
; Frame cap, e.g. 60 (0 = the game's own). Keeps two games on one PC light.
fps_cap=60
; Window position and size, x,y,w,h, e.g. 0,0,1280,800 (empty = leave it).
window=0,0,1280,800
