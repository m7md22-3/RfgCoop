; RfgCoop settings. Put this file next to rfg.exe, beside xinput1_3.dll.
[coop]
; Tag shown in the window title and at the start of every RfgCoop.log line (use A in one game folder, B in the other).
tag=Host
; 1 = two-instance dev mode: alt-tab no longer pauses the game, the gamepad drives only the focused window, and the
; log shows frame counters every 5 s. Also F6 (in gameplay) toggles the ghost: a second Mason that replays you 0.4 s
; late through the co-op code path (experiment E2). F9 captures the world in memory (free roam only), F10 loads it back
; (and turns on a save guard: no saves until you restart), F11 turns the save guard on, F12 dumps nearby objects to
; RfgCoop_objects_<tag>.txt (experiments E3 / E8).
dev=0
; dev=1 also: F5 (gameplay, free roam, no co-op session) runs E4, the one-game destruction experiment (M6 ver7.0): press
; F5, demolish a building, step back about 20 m, press F5 again, then leave the game alone until "E4 done". It reloads
; the world from memory 3-5 times and replays the demolition by itself; the verdict is in RfgCoop.log ("e4 verdict").
; It turns the save guard on: restart the game afterwards. research/notes/destruction_impl.md
; E4 runs per scenario (near60, near30, far60, then again); a static DIFF adds 2 more runs of that condition.
e4_runs=3
; E4 event types recorded (bit = type; 8, 9 and 11 are never recorded): for bisecting a crash by type.
e4_types=0x3FFF
; Recorded steps applied per physics step at most when the replay falls behind (1 = one per step).
destr_catchup=4
; ---- Shared destruction in a co-op session (M6 ver7.1). Only the HOST's values below count: they travel with its world
; (each world it sends is one "epoch"), and the guest follows them. Log lines start with "destr:" and "census:".
; 0 = parallel worlds (each game breaks its own copy, as before ver7.1), 1 = live holes (the host's holes on the guest;
; loose chunks stay local), 2 = full (holes, chunks and debris clean-up follow the host).
destr_sync=2
; 1 = both games use the multiplayer destruction profile during a live session (less random debris, so it can match).
destr_profile=1
; 1 = when the guest re-joined during the host's mission (its world then misses the host's changes and runs parallel),
; it re-syncs by itself when that mission ends (a ~10 s pause for both). 0 = only when the guest presses F3.
destr_autoresync=1
; 1 = the guest's own Rhino / Thrust breaks walls on its screen at once (those buildings are left out of the check and
; may differ slightly); 0 = its holes come from the host a moment later (its charge may stop at the wall until then).
destr_ownpack=0
; Guest: 1 = check every replayed step against the host's (first-touch lines in the log). The census (the "Destruction
; check" HUD line) runs either way. 0 saves a little CPU.
destr_check=1
; Guest key in a session: F3 asks the host for a fresh copy of its world (free roam only; refused during its mission).
; Ghost: metres it walks beside you along the world X axis (0 = exactly in your footsteps; it then bumps into you
; whenever you stop).
ghost_offset=2
; Ghost: 1 = melee and trigger counters advance in single player too (lane L5). 0 = fallback: counters copied back
; after each update (your hammer swings are then not replayed).
l5=1
; Ghost: 0 = E2 control run without the PP-STATS patch: the game must crash on the ghost's first frame (AV at
; rfg+5862E6 reading 0x610). Leave at 1.
pp_stats=1
; 1 = this game saves to kee2_savegame_0_0.sav instead of keen_savegame_0_0.sav. Only for the second game (B).
save_tag=0
; Frame cap, e.g. 60 (0 = the game's own). Keeps two games on one PC light.
fps_cap=0
; Window position and size, x,y,w,h, e.g. 0,0,1280,800 (empty = leave it).
window=
; ---- Co-op session (M2 link, M4 see each other). dev=1 is not needed for a session; two games on one PC still need
; dev=1 in both (alt-tab must not pause the unfocused one). Keys in game (window focused): F8 starts / stops the
; session, F7 teleports you beside the partner. Log lines start with "session:", "net:" and "partner:".
; host = this game listens for the partner; guest = this game connects to `connect`; empty = no co-op (F8 does nothing).
; The host's F8 works in gameplay on a save that has finished the Tutorial (loading one that has not ends the session).
role=host
; UDP port the host listens on (Windows Firewall asks once on the host). Also the guest's port when `connect` has none.
port=27777
; Guest only: the host's address as ip:port, e.g. 127.0.0.1:27777 for two games on one PC, or the host's
; Tailscale / ZeroTier / Radmin address between two PCs. The guest redials every 3 s until the host answers.
connect=
; Same on both sides, or empty on both (an open session: anyone who can reach the host's port can join). At least 10
; characters (F8 refuses a shorter one); use a random one, not a word. It is never sent: the guest proves it knows it
; first, then the host, so a wrong one shows "wrong password" on both games, and 5 wrong tries from one address lock
; that address out for 60 s. Read at every F8 start (fix it and press F8 again). Only a gate against strangers: game
; traffic is not encrypted, and a guest should dial only hosts it trusts (a host it dials, or anyone watching the
; traffic, can try guesses offline; Tailscale / ZeroTier encrypt the link, which closes the watcher case).
password=
; Your name in the partner's window title and HUD lines (empty = tag).
name=
; 1 = start the session by itself on the first gameplay frame (F8 still stops it).
autoconnect=0
; Test shim on what this game receives (0 = off): extra delay in ms, a random extra delay of up to jitter_ms, and the
; percentage of position packets dropped. Set lag_ms on both games to add it both ways.
lag_ms=0
jitter_ms=0
loss_pct=0
; 1 = a green star on the minimap marks the partner, also while it drives or is far away. 0 = no star.
partner_icon=1
